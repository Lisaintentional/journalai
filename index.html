<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue's Training Quiz</title>
  <style>
    :root { font-family: Arial, sans-serif; color-scheme: light; }
    body { margin: 0; background: #f4f7fb; color: #10223a; }
    .container { max-width: 760px; margin: 2rem auto; padding: 1.25rem; }
    .card { background: #fff; border-radius: 12px; padding: 1.2rem; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    h1,h2 { margin-top: 0; }
    .progress { height: 10px; background: #d9e1ee; border-radius: 999px; overflow: hidden; margin-bottom: 1rem; }
    .bar { height: 100%; width: 0%; background: #3f7cff; transition: width .3s; }
    .choices { display: grid; gap: .7rem; }
    button.choice, .btn { border: none; border-radius: 10px; padding: .8rem 1rem; font-size: 1rem; cursor: pointer; }
    button.choice { text-align: left; background: #eef3ff; }
    button.choice:hover { background: #dde8ff; }
    .btn { background: #3f7cff; color: #fff; }
    .btn.secondary { background: #6f7f9a; }
    .hidden { display: none; }
    .pill { display:inline-block; padding:.35rem .6rem; background:#e7efff; border-radius:999px; margin-right:.4rem; margin-bottom:.4rem; }
    .product { border:1px solid #e2e8f5; border-radius:8px; padding:.8rem; margin:.6rem 0; }
    small { color:#4f5f76; }
    .row { display:flex; gap:.6rem; flex-wrap:wrap; margin-top:1rem; }
    input { width: 100%; padding: .7rem; border: 1px solid #c8d3e8; border-radius: 8px; margin: .4rem 0 .8rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="app">
      <h1>🐾 Blue's Better Behavior Quiz</h1>
      <p>Get a personalized 14-day training focus + gear suggestions.</p>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div id="quiz"></div>
      <div id="result" class="hidden"></div>
      <small>Affiliate disclosure: This tool can include Amazon affiliate links. As an Amazon Associate, you may earn from qualifying purchases.</small>
    </div>
  </div>

<script>
const questions = [
  { q: "How old is your dog?", key: "age", a:["Under 1 year","1-3 years","4+ years"] },
  { q: "Biggest challenge right now?", key: "issue", a:["Pulling on leash","Jumping on people","Barking/Reactivity","Recall (coming when called)"] },
  { q: "Daily exercise currently?", key: "exercise", a:["Under 30 min","30-60 min","60+ min"] },
  { q: "How consistent is training at home?", key: "consistency", a:["Rarely","A few days/week","Daily"] },
  { q: "How motivated is your dog by treats?", key: "food", a:["Low","Medium","High"] },
  { q: "Where is behavior worst?", key: "context", a:["Inside home","Walks","Guests/door"] },
  { q: "Any safety concerns?", key: "safety", a:["No","Sometimes lunges","Frequent reactivity"] }
];

const state = { i:0, answers:{} };
const quiz = document.getElementById('quiz');
const resultEl = document.getElementById('result');
const bar = document.getElementById('bar');

function pct(){ return Math.round((state.i / questions.length) * 100) + '%'; }
function renderQuestion(){
  bar.style.width = pct();
  const item = questions[state.i];
  quiz.innerHTML = `
    <h2>Question ${state.i + 1} of ${questions.length}</h2>
    <p>${item.q}</p>
    <div class="choices">${item.a.map(v => `<button class="choice" data-v="${v}">${v}</button>`).join('')}</div>
  `;
  quiz.querySelectorAll('.choice').forEach(btn => {
    btn.onclick = () => {
      state.answers[item.key] = btn.dataset.v;
      state.i++;
      if (state.i < questions.length) renderQuestion();
      else renderResult();
    }
  });
}

function profileFromAnswers(a){
  if (a.issue.includes('Pulling')) return 'Leash Learner';
  if (a.issue.includes('Jumping')) return 'Impulse Control Builder';
  if (a.issue.includes('Barking')) return 'Calm Confidence Builder';
  return 'Recall Reliability Builder';
}

function recommendations(profile){
  const map = {
    "Leash Learner": [
      ["Front-clip harness", "https://www.amazon.com/s?k=front+clip+harness"],
      ["6ft training leash", "https://www.amazon.com/s?k=6+foot+dog+leash"],
      ["Treat pouch", "https://www.amazon.com/s?k=dog+treat+pouch"]
    ],
    "Impulse Control Builder": [
      ["Place cot", "https://www.amazon.com/s?k=dog+place+cot"],
      ["Clicker", "https://www.amazon.com/s?k=dog+clicker"],
      ["High-value treats", "https://www.amazon.com/s?k=high+value+dog+treats"]
    ],
    "Calm Confidence Builder": [
      ["Long line", "https://www.amazon.com/s?k=dog+long+line"],
      ["Enrichment feeder", "https://www.amazon.com/s?k=enrichment+dog+feeder"],
      ["Durable chew", "https://www.amazon.com/s?k=durable+dog+chew"]
    ],
    "Recall Reliability Builder": [
      ["Long line", "https://www.amazon.com/s?k=dog+long+line"],
      ["Whistle", "https://www.amazon.com/s?k=dog+training+whistle"],
      ["Rewards pouch", "https://www.amazon.com/s?k=dog+treat+pouch"]
    ]
  };
  return map[profile] || map["Leash Learner"];
}

function renderResult(){
  quiz.classList.add('hidden');
  resultEl.classList.remove('hidden');
  bar.style.width = '100%';
  const profile = profileFromAnswers(state.answers);
  const recs = recommendations(profile);

  resultEl.innerHTML = `
    <h2>Your Dog's Profile: ${profile}</h2>
    <p><span class="pill">Focus 1: Engagement</span><span class="pill">Focus 2: Consistency</span><span class="pill">Focus 3: Real-world practice</span></p>
    <p><strong>14-day plan:</strong> Train 20-30 minutes daily (short sessions), reward calm choices, and increase distractions slowly.</p>
    <h3>Suggested Gear (Affiliate-ready)</h3>
    ${recs.map(([name, link]) => `<div class="product"><strong>${name}</strong><br /><a href="${link}" target="_blank" rel="noopener noreferrer">View on Amazon</a></div>`).join('')}
    <h3>Get your plan by email</h3>
    <label>Name</label><input id="name" placeholder="Blue's human" />
    <label>Email</label><input id="email" placeholder="you@example.com" />
    <div class="row">
      <button class="btn" id="saveLead">Save Lead (Local Demo)</button>
      <button class="btn secondary" id="restart">Retake Quiz</button>
    </div>
    <p id="msg"></p>
  `;

  document.getElementById('restart').onclick = () => {
    state.i = 0; state.answers = {};
    quiz.classList.remove('hidden');
    resultEl.classList.add('hidden');
    renderQuestion();
  };

  document.getElementById('saveLead').onclick = () => {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    if(!name || !email) return document.getElementById('msg').textContent = 'Please enter name and email.';
    const leads = JSON.parse(localStorage.getItem('blue_leads') || '[]');
    leads.push({ name, email, profile, answers: state.answers, ts: new Date().toISOString() });
    localStorage.setItem('blue_leads', JSON.stringify(leads));
    document.getElementById('msg').textContent = 'Saved! Connect this button to your email tool API next.';
  };
}

renderQuestion();
</script>
</body>
</html>
